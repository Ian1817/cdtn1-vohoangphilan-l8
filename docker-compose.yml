version: '3.8'
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cdtn1_smartcrm_l8
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cdtn1_smartcrm_l8"]
      interval: 5s
      retries: 10

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: cdtn1_smartcrm_l8
      DB_USER: postgres
      DB_PASSWORD: 123456
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata: